	function setMarsTrigger() {
		if( windowObj['Xrm'] && windowObj['Xrm'].Internal && windowObj['Xrm'].Internal.isUci()){ //Unified Client
			if(windowObj['Xrm'].Internal.isFeatureEnabled("GuidedHelp")){
				localStorage.setItem("launchMARSDesigner", true);
				windowObj.history.back();
			}
			else{
				var alertString = {text :window["MarsV1WarningString" + windowObj['Xrm'].Utility.getGlobalContext().getUserLcid().toString()]};
				var promise = windowObj['Xrm'].Navigation.openAlertDialog(alertString);
				promise.then(function(){
					windowObj.history.back();
				});
			}
		}
		else if( windowObj['Xrm'] && windowObj['Xrm'].Internal){ //web client
			var isMarsEnabledForUser = windowObj['Xrm'].Internal.isGuidedHelpEnabledForUser();
			var isMarsEnabledForOrg = windowObj['Xrm'].Internal.isFeatureEnabled("FCB.GuidedHelp");
			var isCustomizableHelp = windowObj.CUSTOMIZED_HELP_ENABLED;
			var isMarsV1Client = windowObj['Xrm'].Page.context.isCrmOnline() && windowObj['Xrm'].Internal.isFeatureEnabled("FCB.MarsLegacyClientEnabled");
			if (isMarsEnabledForOrg && isMarsEnabledForUser && !isCustomizableHelp && !isMarsV1Client) {
				localStorage.setItem("launchMARSDesigner", true);
				windowObj.location.href = windowObj['Xrm'].Page.context.getClientUrl();
			}
			else {
				var alertString = new windowObj['Xrm'].AlertDialogStrings();
				alertString.text = window["MarsV1WarningString" + windowObj['Xrm'].Page.context.getUserLcid()];
				windowObj['Xrm'].Dialog.openAlertDialog(alertString, null, function () { windowObj.location.href = windowObj['Xrm'].Page.context.getClientUrl(); });
			}
		}
	}
