		var cdnUrlUppercase = window.top.CDNURL.toUpperCase();
		var head = document.getElementsByTagName("head")[0];
		var scriptsLoader = new Object();
		var installedLocalesLoaded = false;
		var globalAshxLoaded = false;

        function AppendScriptTag(url,id, callbackFunc) {
	        if (scriptsLoader[url] == null) {
	            scriptsLoader[url] = false;
	            var scriptTag = document.createElement('script');
	            scriptTag.id=id; 
	            scriptTag.type = "text/javascript";
	            scriptTag.language="javascript";
	            scriptTag.src = url;
	            scriptTag.async = true;
	            if (callbackFunc) {
	                scriptTag.onreadystatechange = scriptTag.onload = function () {
	                    if (!scriptsLoader[url] && (!scriptTag.readyState || scriptTag.readyState === "loaded" || scriptTag.readyState === "complete")) {
	                        scriptsLoader[url] = true;
	                        scriptTag.onreadystatechange = scriptTag.onload = null;
	                        callbackFunc();
	                    }
	                };
	            }

	            head.appendChild(scriptTag);
	        }
	    }

        var installedLocalesPath = "InstalledLocales.js?ver=" + window.top.VERSION_STAMP;
        AppendScriptTag(installedLocalesPath, "installedLocalesScript", callbackInstalledLocalesLoaded);

        // Batch 3: ClientGlobalContext has been loaded, load Global.ashx
        var globalAshxWithVersion = "../../../_common/global.ashx?ver=" + window.top.VERSION_STAMP;
        var globalAjaxCall = new XMLHttpRequest();
        globalAjaxCall.onreadystatechange = function () {
            if (globalAjaxCall.readyState === 4) {
                AppendScriptTag(globalAshxWithVersion, "globalScript", callbackGlobalAshxLoaded);
                globalAjaxCall.onreadystatechange = null;
            }
        };
        globalAjaxCall.open("GET", globalAshxWithVersion, false);
        globalAjaxCall.send();

        function callbackInstalledLocalesLoaded() {
            installedLocalesLoaded = true;
            RunHandlers();
        }

        function callbackGlobalAshxLoaded() {
            globalAshxLoaded = true;
            RunHandlers();
        }

        function RunHandlers() {
            // Load all the other scripts once the installedlocale.js & global.ashx are loaded.
            if (installedLocalesLoaded && globalAshxLoaded) {
                //Below code indicates installedlocale.js & global.ashx are already loaded
                //and we are making these as false that these scripts should not load again.
                installedLocalesLoaded = false;
                globalAshxLoaded = false;
                // Batch 4: GlobalAshx has been loaded, Load Rest of the scripts
                loadScripts();
            }
        }
	</script>

    <script type="text/javascript">
        var wallPage = null;
        var wallCommandDispatcher = null;
        var wallElement = null;
        var retrycount = 0;
        var _aWrpcTokens;
        var _sWebServicesNamespace;
        var ERRORCODE_ETM;
        var LOCID_ERRMSG_ETM_RETRY;
        var LOCID_REMOTECOMMAND_ERROR;
        var IS_PATHBASEDURLS = window.top.IS_PATHBASEDURLS;
        var wallIsLoaded = false;

        function initializeRecordWall() {
            var client = GetGlobalContext().client;
            if (client.getClientState() == Xrm.ClientState.online) {
                wallPage = null;
                wallCommandDispatcher = null;
                wallElement = null;
                retrycount = 0;
                _aWrpcTokens = null;
                _sWebServicesNamespace = null;
                ERRORCODE_ETM = null;
                LOCID_ERRMSG_ETM_RETRY = null;
                LOCID_REMOTECOMMAND_ERROR = null;
                IS_PATHBASEDURLS = window.top.IS_PATHBASEDURLS;
                wallIsLoaded = false;

                window.LoadRecordWall = function LoadRecordWall() {
                    if (wallIsLoaded) {
                        return;
                    }

                    var loadWall = true;

                    if (client.getClientState() == Xrm.ClientState.online) {
                        //Hides wall for print preview and bulkedit
                        //This is a hack, but this is the only way to hide wall because onload event doesn't fire for those forms
                        // TODO: this list would grow overtime as crm adds special pages to print.aspx
                        if (this.parent != null && this.parent.location != null && this.parent.location.pathname != null && this.parent.document != null) {
                            iframes = this.parent.document.getElementsByTagName('iframe');
                            for (i = 0; i < iframes.length; i++) {
                                if (iframes[i].src != null && iframes[i].src.toLowerCase().indexOf('recordwall.htm') > 0) {
                                    pathname = this.parent.location.pathname.toLowerCase();
                                    if ((pathname.indexOf('custformprint.aspx') > 0) || (pathname.indexOf('goalprintpage.aspx') > 0)) {
                                        $(iframes[i]).parents('div.ms-crm-Tab-Print').hide();
                                        loadWall = false;
                                    }

                                    if (pathname.indexOf('dlg_bulkedit.aspx') > 0) {
                                        $(iframes[i]).parents('div.ms-crm-InlineTab').hide();
                                        loadWall = false;
                                    }
                                }
                            }
                        }

                        wallPageQueryString = new ActivityFeeds.UI.WallPageQueryString(window.location);
                        loadWall = loadWall && !wallPageQueryString.get_isCreateForm();

                        if (loadWall) {
                            loadLocalizedContent('WallContent.htm', GetGlobalContext(), function (content) {
                                wallIsLoaded = true;
                                document.getElementById('wallElementContainer').innerHTML = content;
                                document.onselectstart = null;
                                wallPage = ActivityFeeds.UI.WallPage.createRecordWallPageInIFrame();
                                wallCommandDispatcher = new ActivityFeeds.UI.WallCommandDispatcher(wallPage.get_wall(), wallPage.get_wallService());
                                wallElement = $('#wallElementContainer').find('.recordWall')[0];
                                $("#postTextBox").focus();
                            });
                            loadLocalizedContent('UserProfileContent.htm', GetGlobalContext(), function (content) {
                                document.getElementById('profileContainer').innerHTML = content;
                                $("#userProfile").hide();
                            });
                        }
                    }
                };

                window.dispatchWallCommand = function dispatchWallCommand(wall, commandName, parameters) {
                    wallCommandDispatcher.dispatchCommand(commandName, parameters);
                };

                $(document).ready(function () {
                    applyDocumentStyles();
                    LoadRecordWall();
                });
            }
        }

    </script>
